name: 📊 Code Quality

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "releases/*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    name: 🔍 Qodana Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: 🔍 Qodana Scan
        id: qodana
        uses: JetBrains/qodana-action@30fde78cf6cbdc081bfc9f575778eeab02c2f761   # v2026.2.2
        continue-on-error: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          args: "--baseline,qodana.sarif.json,--fail-threshold,0"
          cache-default-branch-only: true
          upload-result: false

      - name: 📊 Upload Qodana Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: always()
        with:
          name: qodana-report
          path: ${{ github.workspace }}/qodana
          if-no-files-found: ignore

      - name: 📋 Qodana Summary
        if: always()
        run: |
          {
            echo "## 🔍 Qodana Analysis"
            echo ""
            if [ "${{ steps.qodana.outcome }}" == "success" ]; then
              echo "✅ **Qodana scan completed successfully**"
            elif [ "${{ steps.qodana.outcome }}" == "failure" ]; then
              echo "❌ **Qodana scan failed**"
              echo ""
              echo "### 🔧 Possíveis causas:"
              echo "- Token QODANA_TOKEN não configurado"
              echo "- Baseline de qualidade excedido"
            else
              echo "⚠️ **Qodana scan skipped**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  sonarqube:
    name: 📊 SonarQube Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🔑 Check Sonar token
        id: sonar-token
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN não configurado — pulando SonarQube"
          fi

      - name: 🗄️ Setup .NET
        if: steps.sonar-token.outputs.present == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: ☕ Set up JDK 17
        if: steps.sonar-token.outputs.present == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad   # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Install SonarScanner
        if: steps.sonar-token.outputs.present == 'true'
        run: dotnet tool install --global dotnet-sonarscanner

      - name: 📊 SonarQube Scan
        if: steps.sonar-token.outputs.present == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # EF migrations são scaffold do dotnet-ef — deltas de boilerplate
          # entre providers parecem duplicação para o quality gate.
          dotnet sonarscanner begin \
            /k:"afonsoft_open-webui" \
            /o:"afonsoft" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cpd.exclusions="**/Migrations/**" \
            /d:sonar.exclusions="docs/**,skills/**,.agents/**,.claude/skills/**,.devin/**,.ci/**"
          dotnet build OpenWebUI.slnx --configuration Release
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
