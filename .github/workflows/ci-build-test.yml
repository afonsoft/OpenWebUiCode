name: 🚀 CI Build & Test

permissions: {}

on:
  push:
    branches:
      - "main"
      - "feature/*"
      - "fix/*"
      - "bug/*"
      - "hotfix/*"
      - "chore/*"
      - "test/*"
  pull_request:
    branches:
      - "main"
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION: "OpenWebUI.slnx"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

# Cancela a run anterior do mesmo ref: push novo torna a antiga obsoleta.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classificação do diff (padrão OmniRoute/OpenHandsNET): jobs downstream só
  # pagam pelo que pode quebrar — PR docs-only pula build/test/docker, e PRs
  # em draft não rodam os jobs pesados (ready_for_review re-dispara).
  changes:
    name: Change classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      docs: ${{ steps.classify.outputs.docs }}
      workflow: ${{ steps.classify.outputs.workflow }}
      docker: ${{ steps.classify.outputs.docker }}
      testsOnly: ${{ steps.classify.outputs.testsOnly }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject PR that targets its own branch
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$HEAD_REF" = "$BASE_REF" ]; then
            echo "::error::PR targets its own head branch ($BASE_REF) — nothing can merge."
            exit 1
          fi

      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            {
              echo "code=true"; echo "docs=true"; echo "workflow=true"
              echo "docker=true"; echo "testsOnly=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | \
            bash scripts/classify-changes.sh

  build-openwebui:
    name: Build OpenWebUI (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.code == 'true') }}
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION }} --verbosity normal

      - name: Build Solution
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release --verbosity minimal

  test:
    name: Tests + Coverage Gate (NUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, build-openwebui]
    if: ${{ !cancelled() && needs.build-openwebui.result == 'success' }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Única passada: testes + cobertura juntos (coverlet.collector está nos
      # dois projetos de teste; o runsettings exclui Client/migrations do
      # denominador). Antes eram 2 rodadas de teste — ~2min economizados.
      - name: Run All Tests + Coverage
        run: dotnet test ${{ env.SOLUTION }} --configuration Release --verbosity minimal --logger "trx;LogFileName=tests.trx" --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./TestResults

      # Vars lidas via GetEnvironmentVariable no código devem estar
      # documentadas em .env.exemplo (SPEC drift check).
      - name: Env drift check
        run: ./scripts/check-env-drift.sh

      # Gate de cobertura: o piso vive em .ci/coverage-baseline.txt (linha) e
      # .ci/coverage-branch-baseline.txt (branch) — baselines commitadas, não
      # hardcoded. O job coverage-ratchet sobe os baselines quando a cobertura
      # medida na main melhora (ratchet, nunca desce).
      - name: Coverage Gate + Summary
        run: |
          # Api.Tests e Client.Tests emitem um cobertura.xml cada — o do gate é
          # o que contém OpenWebUI.Infrastructure (Client é excluído via
          # runsettings, seu XML não tem esse pacote).
          XML=$(find TestResults -name coverage.cobertura.xml -exec grep -l 'OpenWebUI.Infrastructure' {} \; | head -1)
          if [ -z "$XML" ]; then echo "::error::coverage.cobertura.xml not found"; exit 1; fi
          mkdir -p .artifacts
          python3 - "$XML" <<'PY'
          import sys, xml.etree.ElementTree as ET
          r = ET.parse(sys.argv[1]).getroot()
          line, branch = float(r.get('line-rate'))*100, float(r.get('branch-rate'))*100
          print(f"Line coverage: {line:.2f}%  Branch coverage: {branch:.2f}%")
          with open('.ci/coverage-baseline.txt') as f: lb = float(f.read().strip() or 0)
          import os
          bb = float(open('.ci/coverage-branch-baseline.txt').read().strip() or 0) if os.path.exists('.ci/coverage-branch-baseline.txt') else 0.0
          # resumo por projeto no step summary e em arquivo p/ comentário no PR
          rows = ["", "## 📈 Cobertura", "", "| Projeto | Linha | Branch |", "|---|---|---|"]
          for p in r.iter('package'):
              n = p.get('name') or ''
              if 'Tests' in n: continue
              rows.append(f"| {n} | {float(p.get('line-rate'))*100:.1f}% | {float(p.get('branch-rate'))*100:.1f}% |")
          rows.append(f"| **Total** | **{line:.1f}%** | **{branch:.1f}%** |")
          report = '\n'.join(rows)+'\n'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f: f.write(report)
          with open('.artifacts/coverage-summary.md', 'w') as f: f.write(report)
          ok = True
          TOL = 0.05  # banda de variância de medição entre runs idênticas (±0.04 observado)
          if line < lb - TOL: print(f"::error::Line coverage {line:.2f}% < baseline {lb}%"); ok = False
          if branch < bb - TOL: print(f"::error::Branch coverage {branch:.2f}% < baseline {bb}%"); ok = False
          sys.exit(0 if ok else 1)
          PY
          echo "Coverage gate passed (line + branch)."

      - name: Upload Test Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
        if: always()
        with:
          name: test-results
          path: "**/tests.trx"
          if-no-files-found: ignore

      - name: Upload Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
        if: always()
        with:
          name: coverage-xml
          path: "**/coverage.cobertura.xml"
          if-no-files-found: ignore

      # Sticky PR coverage comment (padrão OmniRoute): um comentário marcador,
      # atualizado a cada run — só em PRs do próprio repo (token não sai em forks).
      - name: PR coverage comment
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3   # v9
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- openwebui-coverage-report -->";
            let body = marker + "\n## Coverage report\n\n";
            try {
              body += fs.readFileSync(".artifacts/coverage-summary.md", "utf8");
            } catch {
              body += "_coverage report unavailable for this run_\n";
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  blazor-client-validation:
    name: Blazor WASM Client Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, build-openwebui]
    if: ${{ !cancelled() && needs.build-openwebui.result == 'success' }}
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build Blazor WASM Client
        run: dotnet build src/OpenWebUI.Client/OpenWebUI.Client.csproj --configuration Release --verbosity minimal

      - name: Validate WASM Assets
        run: |
          # Build simples emite o payload fingerprinted em _framework/;
          # index.html fica em wwwroot e é servido pelo host OpenWebUI.Api.
          fw="src/OpenWebUI.Client/bin/Release/net10.0/wwwroot/_framework"
          app_wasm=$(find "$fw" -maxdepth 1 -name 'OpenWebUI.Client.*.wasm' | head -1)
          if [ -z "$app_wasm" ]; then
            echo "::error::WASM do app nao gerado em $fw (OpenWebUI.Client.*.wasm)"
            exit 1
          fi
          if [ ! -f "src/OpenWebUI.Client/wwwroot/index.html" ]; then
            echo "::error::wwwroot/index.html ausente no projeto Client"
            exit 1
          fi
          echo "Blazor WASM assets gerados com sucesso: $(basename "$app_wasm")"
          echo "payloads em _framework: $(find "$fw" -maxdepth 1 -type f | wc -l)"

      # Drift guards do E13: classes CSS inexistentes, controles de
      # formulário sem nome acessível e chaves i18n sem paridade nos 8
      # locales. Falha em qualquer um quebra o job (SPEC-20261008-ci-tool-guards).
      - name: Drift guards (css-classes, form-a11y, i18n-parity)
        run: |
          python3 tools/check-css-classes.py
          python3 tools/check-form-a11y.py
          python3 tools/check-i18n-parity.py

  # Hard rule do repo: tailwind.css é artefato gerado e commitado junto das
  # mudanças de classe nos .razor — este job pega o esquecimento no diff.
  tailwind-freshness:
    name: Tailwind CSS em dia
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.code == 'true') }}
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false

      - name: Cache Tailwind CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6
        with:
          path: /tmp/tailwindcss
          key: tailwindcss-v4.3.3-linux-x64

      - name: Install Tailwind CLI (standalone)
        run: |
          # Versão pinada — output de `latest` diverge do artefato commitado.
          [ -x /tmp/tailwindcss ] || curl -sSL --proto-redir =https -o /tmp/tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          chmod +x /tmp/tailwindcss
          /tmp/tailwindcss --help | head -1

      - name: Regenerate and diff
        # Deve rodar da raiz do repo (comando documentado em CLAUDE.md):
        # rodando de src/OpenWebUI.Client o output do CLI diverge do commitado.
        run: |
          /tmp/tailwindcss -i src/OpenWebUI.Client/tailwind.input.css \
            -o src/OpenWebUI.Client/wwwroot/css/tailwind.css --minify
          if ! git diff --exit-code -- src/OpenWebUI.Client/wwwroot/css/tailwind.css; then
            echo "::error::wwwroot/css/tailwind.css desatualizado — regenere com o comando acima e commite junto"
            exit 1
          fi

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, build-openwebui]
    # Roda quando código de produção ou a superfície docker mudou; diffs
    # puros de docs/tests não alteram a imagem.
    if: ${{ !cancelled() && needs.build-openwebui.result == 'success' && (github.event_name != 'pull_request' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.code == 'true') }}
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1

      - name: Build Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: openwebui:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # Política de testes do PR (padrão OmniRoute): código de produção mudou ->
  # teste precisa mudar junto. Determinístico, sem estado externo — bloqueante.
  pr-test-policy:
    name: PR test policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source changes include tests
        run: bash scripts/check-pr-test-policy.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  # Depois de push na main, sobe .ci/coverage-baseline.txt para a taxa medida
  # quando ela melhorou. O gate nos PRs passa a exigir "sem regressão vs main".
  coverage-ratchet:
    name: Coverage Baseline Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Download Coverage Report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: coverage-xml

      - name: Raise Baseline When Improved
        run: |
          XML=$(find . -name coverage.cobertura.xml -exec grep -l 'OpenWebUI.Infrastructure' {} \; | head -1)
          if [ -z "$XML" ]; then echo "coverage xml not found — skipping ratchet"; exit 0; fi
          # Marcador em arquivo — `set -e` do runner mataria o step num exit 1
          # do python antes do `if`, então o sinal de "melhorou" sai via /tmp.
          rm -f /tmp/raise-baseline
          python3 - "$XML" <<'PY'
          import sys, os, xml.etree.ElementTree as ET
          r = ET.parse(sys.argv[1]).getroot()
          pairs = [('.ci/coverage-baseline.txt', float(r.get('line-rate'))*100),
                   ('.ci/coverage-branch-baseline.txt', float(r.get('branch-rate'))*100)]
          changed = False
          for f, rate in pairs:
              old = float(open(f).read().strip() or 0) if os.path.exists(f) else 0.0
              print(f"{f}: measured {rate:.2f}% vs baseline {old}%")
              if rate > old:
                  open(f, 'w').write(f"{rate:.2f}\n")
                  changed = True
          if changed: open('/tmp/raise-baseline', 'w').close()
          PY
          if [ -f /tmp/raise-baseline ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .ci/coverage-baseline.txt .ci/coverage-branch-baseline.txt
            git commit -m "chore(ci): raise coverage baselines [skip ci]"
            git push
          else
            echo "coverage did not improve — baselines unchanged"
          fi

  # Veredito de admissão (padrão OmniRoute): UM status check que a branch
  # protection exige. Job cancelado ou skipped-by-design é avaliado
  # explicitamente — cancelled nunca lê como verde.
  admission-verdict:
    name: Gate / CI
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs:
      - changes
      - build-openwebui
      - test
      - blazor-client-validation
      - tailwind-freshness
      - docker-build
      - pr-test-policy
    steps:
      - name: evaluate admission
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          failed, cancelled = [], []
          print("| Job | Result |", "|---|---|", sep="\n")
          for name, data in sorted(needs.items()):
              r = data["result"]
              print(f"| {name} | {r} |")
              if r == "failure": failed.append(name)
              if r in ("cancelled", "startup_failure"): cancelled.append(name)
          if cancelled:
              print(f"::error::job(s) cancelled — no verdict reported: {', '.join(cancelled)}")
          if failed:
              print(f"::error::gate(s) failed: {', '.join(failed)}")
          sys.exit(1 if (failed or cancelled) else 0)
          PY

  ci-summary:
    name: CI Dashboard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs:
      - changes
      - build-openwebui
      - test
      - blazor-client-validation
      - tailwind-freshness
      - docker-build
      - pr-test-policy
      - admission-verdict
    steps:
      - name: generate dashboard
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          status() {
            case "$1" in
              success) echo "🟢 PASS" ;; failure) echo "🔴 FAIL" ;;
              cancelled) echo "⚫ CANCELLED" ;; skipped) echo "⚪ SKIPPED" ;;
              *) echo "🟡 $1" ;;
            esac
          }
          {
            echo "# CI Dashboard"; echo ""
            # Job cancelado nunca reportou veredito — nomeia-os no TOPO.
            CANCELLED=$(printf '%s' "$NEEDS_JSON" \
              | jq -r 'to_entries | map(select(.value.result == "cancelled")) | .[].key' \
              | sort | paste -sd", " - || true)
            if [ -n "$CANCELLED" ]; then
              echo "> ### ⚫ Cancelled — no verdict was reported"
              echo "> \`$CANCELLED\`"
              echo "> These did not fail; they never finished. If the cancellation came"
              echo "> from a newer push, that run covers it — otherwise re-run them."
              echo ""
            fi
            echo "| Job | Status |"; echo "|---|---|"
            for j in changes build-openwebui test blazor-client-validation tailwind-freshness docker-build pr-test-policy admission-verdict; do
              echo "| $j | $(status "$(printf '%s' "$NEEDS_JSON" | jq -r ".[\"$j\"].result // \"unknown\"")") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
