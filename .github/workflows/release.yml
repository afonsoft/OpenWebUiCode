name: 🚀 Release & Publish

permissions: {}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.2.0)'
        required: true
        default: '0.2.0'

env:
  DOTNET_VERSION: "10.0.x"

# Uma run por tag/branch; releases não são canceladas em andamento.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: 🏷️ Validate Version Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 🔍 Extract Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $VERSION (expected X.Y.Z)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

  build-release:
    name: 🏗️ Build Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate-tag
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: 🗄️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🔧 Restore & Build
        run: |
          dotnet restore OpenWebUI.slnx
          dotnet build OpenWebUI.slnx --configuration Release --no-restore

      # Publicação framework-dependent: o binário precisa do runtime .NET 10
      # instalado; a imagem Docker (self-contained) é o artefato principal.
      - name: 📦 Publish (linux-x64)
        run: |
          dotnet publish src/OpenWebUI.Api/OpenWebUI.Api.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained false \
            -p:Version=${{ needs.validate-tag.outputs.version }} \
            --output ./publish/linux-x64

      - name: 📦 Publish (win-x64)
        run: |
          dotnet publish src/OpenWebUI.Api/OpenWebUI.Api.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained false \
            -p:Version=${{ needs.validate-tag.outputs.version }} \
            --output ./publish/win-x64

      - name: 🗜️ Package Archives
        run: |
          tar -C ./publish/linux-x64 -czf ./publish/openwebui-linux-x64.tar.gz .
          cd ./publish/win-x64 && zip -qr ../openwebui-win-x64.zip .

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
        with:
          name: openwebui-${{ needs.validate-tag.outputs.version }}
          path: |
            ./publish/openwebui-linux-x64.tar.gz
            ./publish/openwebui-win-x64.zip
          retention-days: 30

  publish-docker:
    name: 🐳 Publish Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate-tag, build-release]
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f   # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build and Push Docker Image (GHCR)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          load: true
          tags: |
            ghcr.io/afonsoft/open-webui:${{ needs.validate-tag.outputs.version }}
            ghcr.io/afonsoft/open-webui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # Docker Hub publica afonsoft/open-webui quando os secrets DOCKERHUB_*
      # existirem no repo — sem eles os steps abaixo são pulados.
      - name: 🔐 Log in to Docker Hub (optional)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f   # v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: 🐳 Push to Docker Hub (optional)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          VER="${{ needs.validate-tag.outputs.version }}"
          docker tag ghcr.io/afonsoft/open-webui:$VER "$DOCKERHUB_USERNAME/open-webui:$VER"
          docker tag ghcr.io/afonsoft/open-webui:$VER "$DOCKERHUB_USERNAME/open-webui:latest"
          docker push "$DOCKERHUB_USERNAME/open-webui:$VER"
          docker push "$DOCKERHUB_USERNAME/open-webui:latest"

  create-release:
    name: 📝 Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate-tag, build-release, publish-docker]
    permissions:
      contents: write
    steps:
      - name: 📤 Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: openwebui-${{ needs.validate-tag.outputs.version }}
          path: ./publish

      - name: 📝 Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64   # v3.0.3
        with:
          tag_name: v${{ needs.validate-tag.outputs.version }}
          name: Release v${{ needs.validate-tag.outputs.version }}
          body: |
            ## 🚀 Open WebUI (.NET) v${{ needs.validate-tag.outputs.version }}

            ### Downloads
            - **Linux (x64):** openwebui-linux-x64 (requer runtime .NET 10)
            - **Windows (x64):** openwebui-win-x64 (requer runtime .NET 10)
            - **Docker:** ghcr.io/afonsoft/open-webui:${{ needs.validate-tag.outputs.version }}

            ### Changes
            Automated release from tag v${{ needs.validate-tag.outputs.version }}
          files: |
            ./publish/openwebui-linux-x64.tar.gz
            ./publish/openwebui-win-x64.zip
          draft: false
          prerelease: false
