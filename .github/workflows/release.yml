name: 🚀 Release & Publish

permissions: {}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.2.0)'
        required: true
        default: '0.2.0'

env:
  DOTNET_VERSION: "10.0.x"

# Uma run por tag/branch; releases não são canceladas em andamento.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: 🏷️ Validate Version Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 🔍 Extract Version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # input via env — expressões template direto no run são
          # template-injection (zizmor).
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $VERSION (expected X.Y.Z)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION"

  build-release:
    name: 🏗️ Build Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate-tag
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false

      - name: 🗄️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68   # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🔧 Restore & Build
        run: |
          dotnet restore OpenWebUI.slnx
          dotnet build OpenWebUI.slnx --configuration Release --no-restore

      # Publicação framework-dependent: o binário precisa do runtime .NET 10
      # instalado; a imagem Docker (self-contained) é o artefato principal.
      - name: 📦 Publish (linux-x64)
        run: |
          dotnet publish src/OpenWebUI.Api/OpenWebUI.Api.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained false \
            -p:Version=${{ needs.validate-tag.outputs.version }} \
            --output ./publish/linux-x64

      - name: 📦 Publish (win-x64)
        run: |
          dotnet publish src/OpenWebUI.Api/OpenWebUI.Api.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained false \
            -p:Version=${{ needs.validate-tag.outputs.version }} \
            --output ./publish/win-x64

      - name: 🗜️ Package Archives
        run: |
          tar -C ./publish/linux-x64 -czf ./publish/openwebui-linux-x64.tar.gz .
          cd ./publish/win-x64 && zip -qr ../openwebui-win-x64.zip .

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
        with:
          name: openwebui-${{ needs.validate-tag.outputs.version }}
          path: |
            ./publish/openwebui-linux-x64.tar.gz
            ./publish/openwebui-win-x64.zip
          retention-days: 30

  # Cada arquitetura é buildada em runner nativo (ubuntu-24.04-arm é gratuito
  # em repos públicos) e publicada por digest; as tags multi-arch são criadas
  # no merge-manifests. QEMU seria ~5x mais lento para publish self-contained
  # + wasm-tools + Chromium. O Dockerfile resolve RID/gh/Playwright por
  # `uname -m`, então funciona nativo em ambas as plataformas.
  publish-docker:
    name: 🐳 Build Image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs: [validate-tag, build-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: linux-amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            slug: linux-arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f   # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build and Push by Digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=ghcr.io/${{ github.repository }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }},ignore-error=true

      - name: 📤 Export Digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: 📤 Upload Digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7
        with:
          name: digest-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifests:
    name: 🏷️ Tag Multi-Arch Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate-tag, publish-docker]
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Download Digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f   # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Create Multi-Arch Tags (GHCR)
        run: |
          VER="${{ needs.validate-tag.outputs.version }}"
          srcs=()
          for f in /tmp/digests/*; do
            srcs+=("ghcr.io/${{ github.repository }}@sha256:${f##*/}")
          done
          docker buildx imagetools create \
            -t "ghcr.io/${{ github.repository }}:$VER" \
            -t "ghcr.io/${{ github.repository }}:latest" \
            "${srcs[@]}"

      # Docker Hub publica afonsoft/open-webui quando os secrets DOCKERHUB_*
      # existirem no repo — sem eles os steps abaixo são pulados.
      - name: 🔐 Log in to Docker Hub (optional)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f   # v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: 🐳 Push to Docker Hub (optional)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          VER="${{ needs.validate-tag.outputs.version }}"
          docker buildx imagetools create \
            -t "$DOCKERHUB_USERNAME/open-webui:$VER" \
            -t "$DOCKERHUB_USERNAME/open-webui:latest" \
            "ghcr.io/${{ github.repository }}:$VER"

  # Registra o deployment na página /deployments do repo: o key `environment`
  # cria o registro automaticamente e auto-cria o environment "production"
  # na primeira run. `url` vem da repo variable DEPLOY_URL (opcional).
  deploy:
    name: 🚢 Register Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate-tag, merge-manifests]
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - name: 🚢 Image published — hosts pull via watchtower
        run: |
          echo "ghcr.io/${{ github.repository }}:${{ needs.validate-tag.outputs.version }} published (amd64+arm64)."
          echo "Hosts on docker-compose.prod.yaml atualizam sozinhos via watchtower (poll 5min)."

  create-release:
    name: 📝 Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate-tag, build-release, merge-manifests]
    permissions:
      contents: write
    steps:
      - name: 📤 Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: openwebui-${{ needs.validate-tag.outputs.version }}
          path: ./publish

      - name: 📝 Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64   # v3.0.3
        with:
          tag_name: v${{ needs.validate-tag.outputs.version }}
          name: Release v${{ needs.validate-tag.outputs.version }}
          body: |
            ## 🚀 Open WebUI (.NET) v${{ needs.validate-tag.outputs.version }}

            ### Downloads
            - **Linux (x64):** openwebui-linux-x64 (requer runtime .NET 10)
            - **Windows (x64):** openwebui-win-x64 (requer runtime .NET 10)
            - **Docker:** ghcr.io/afonsoft/open-webui:${{ needs.validate-tag.outputs.version }}

            ### Changes
            Automated release from tag v${{ needs.validate-tag.outputs.version }}
          files: |
            ./publish/openwebui-linux-x64.tar.gz
            ./publish/openwebui-win-x64.zip
          draft: false
          prerelease: false
