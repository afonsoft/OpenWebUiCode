name: 🐳 Docker Hub Overview

permissions: {}

# Manual only — sincroniza o overview canônico do repo (docs/dockerhub/overview.md)
# + descrição curta para a página do repositório no Docker Hub via
# scripts/update-dockerhub-overview.sh. Requer os secrets DOCKERHUB_USERNAME /
# DOCKERHUB_TOKEN (PAT com escopo Read/Write/Delete — o Hub trata edição de
# metadados como operação admin).
on:
  workflow_dispatch:

jobs:
  update-overview:
    name: 📝 Sync overview to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false

      - name: 📝 Update Docker Hub description + overview
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: ./scripts/update-dockerhub-overview.sh
