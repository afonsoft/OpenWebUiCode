version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 10
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
        update-types: ["minor", "patch"]
      efcore:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
        update-types: ["minor", "patch"]
      test-sdk:
        patterns:
          - "NUnit*"
          - "coverlet*"
          - "Microsoft.NET.Test.Sdk"
          - "bunit*"
          - "Microsoft.Playwright*"
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      actions:
        patterns:
          - "actions/*"
