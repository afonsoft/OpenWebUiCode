<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#ffffff" />
		<meta name="description" content="Open WebUI — self-hosted AI chat interface for Ollama, OpenAI and compatible providers." />
		<title>Open WebUI</title>
		<base href="/" />
		<link rel="manifest" href="manifest.webmanifest" />
		<link rel="icon" type="image/png" href="favicon.png" />
		<link rel="icon" type="image/svg+xml" href="favicon.svg" />
		<link rel="preload" href="assets/fonts/Inter-Variable.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="js/boot.js" as="script" />
		<link rel="preload" href="_framework/blazor.webassembly.js" as="script" />
		<link rel="stylesheet" href="css/tailwind.css" />
		<script>
			// Aplica o tema antes do primeiro paint, como no upstream.
			const theme = localStorage.getItem('webui.theme') || 'light';
			const themeMq = window.matchMedia('(prefers-color-scheme: dark)');
			const isDark =
				theme === 'dark' ||
				(theme === 'system' && themeMq.matches);
			document.documentElement.classList.toggle('dark', isDark);
			document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
			// SPEC-20261018-themes-custom: repinta paleta custom do cache e
			// segue o SO quando o modo é 'system' (listener sobrevive ao boot).
			try {
				const themeId = localStorage.getItem('webui.theme.id');
				const themeCss = localStorage.getItem('webui.theme.css');
				if (themeId && themeId !== 'default' && themeCss) {
					document.documentElement.classList.add('theme-' + themeId);
					const st = document.createElement('style');
					st.id = 'user-theme';
					st.textContent = themeCss;
					document.head.appendChild(st);
				}
				const followSystem = function () {
					if ((localStorage.getItem('webui.theme') || 'light') === 'system') {
						document.documentElement.classList.toggle('dark', themeMq.matches);
						document.documentElement.dataset.theme = themeMq.matches ? 'dark' : 'light';
					}
				};
				if (themeMq.addEventListener) themeMq.addEventListener('change', followSystem);
				else if (themeMq.addListener) themeMq.addListener(followSystem);
			} catch (e) { /* storage negado */ }
		</script>
		<script src="js/app.js" defer></script>
		<script src="js/audio.js" defer></script>
		<script src="js/codeexec.js" defer></script>
		<script src="js/codeblocks.js" defer></script>
		<script src="js/collab.js" defer></script>
		<script src="js/terminal.js" defer></script>
		<script src="js/ide-editor.js" defer></script>
		<script src="js/ide-layout.js" defer></script>
		<script>
			if ('serviceWorker' in navigator) {
				navigator.serviceWorker.register('service-worker.js')
					.then(reg => console.debug('SW registered', reg.scope))
					.catch(err => console.warn('SW registration failed', err));
			}
		</script>
	</head>

	<body>
		<div id="app">
			<div class="boot-splash">
				<img src="assets/splash-dark.png" alt="Open WebUI" width="128" height="128" fetchpriority="high" />
				<span>Open WebUI</span>
			</div>
		</div>

		<div id="blazor-error-ui">
			An unhandled error has occurred.
			<a href="." class="reload">Reload</a>
			<button type="button" class="error-details-toggle">Details</button>
			<button type="button" class="dismiss" aria-label="Dismiss">🗙</button>
			<pre class="error-details" hidden></pre>
		</div>
		<script src="_framework/blazor.webassembly.js" autostart="false" defer></script>
		<script src="js/boot.js" defer></script>
	</body>
</html>
