<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="pensando">
  <style>
    /* CSS em vez de SMIL: honra prefers-reduced-motion (AC da SPEC) —
       animateTransform SMIL não pode ser neutralizado por media query. */
    .gear {
      transform-box: fill-box;
      transform-origin: center;
    }
    .gear-cw {
      animation: brain-gear-spin 4s linear infinite;
    }
    .gear-ccw {
      animation: brain-gear-spin-rev 2.5s linear infinite;
    }
    @keyframes brain-gear-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes brain-gear-spin-rev {
      to { transform: rotate(-360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .gear-cw, .gear-ccw { animation: none; }
    }
  </style>
  <path fill="#9ca3af" stroke="#6b7280" stroke-width="0.55" stroke-linejoin="round"
