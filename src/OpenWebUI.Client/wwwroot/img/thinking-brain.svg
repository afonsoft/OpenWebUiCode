  <path fill="none" stroke="#6b7280" stroke-width="0.55" stroke-linecap="round" opacity="0.85"
    d="M11.9 4.7c-1.1 1.4-1.3 2.9-.7 4.2.5 1.2.4 2.5-.3 3.6"/>
  <path fill="none" stroke="#6b7280" stroke-width="0.5" stroke-linecap="round" opacity="0.7"
    d="M7.6 8.7c.9.2 1.6.8 1.9 1.6m5.2-2.4c-1 .1-1.8.8-2.1 1.8"/>
  <g transform="translate(7.9 17.4)">
    <g class="gear gear-cw" fill="#3b82f6">
      <rect x="-0.65" y="-4.5" width="1.3" height="1.7" rx="0.5"/>
      <rect x="-0.65" y="-4.5" width="1.3" height="1.7" rx="0.5" transform="rotate(45)"/>
      <rect x="-0.65" y="-4.5" width="1.3" height="1.7" rx="0.5" transform="rotate(90)"/>
      <rect x="-0.65" y="-4.5" width="1.3" height="1.7" rx="0.5" transform="rotate(135)"/>
      <circle r="3"/>
    </g>
    <circle r="1.15" fill="#dbeafe"/>
  </g>
  <g transform="translate(15.7 18)">
    <g class="gear gear-ccw" fill="#60a5fa">
      <rect x="-0.5" y="-3.3" width="1" height="1.25" rx="0.4"/>
      <rect x="-0.5" y="-3.3" width="1" height="1.25" rx="0.4" transform="rotate(45)"/>
      <rect x="-0.5" y="-3.3" width="1" height="1.25" rx="0.4" transform="rotate(90)"/>
      <rect x="-0.5" y="-3.3" width="1" height="1.25" rx="0.4" transform="rotate(135)"/>
      <circle r="2.1"/>
    </g>
    <circle r="0.85" fill="#dbeafe"/>
