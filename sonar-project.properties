# SonarCloud — afonsoft/open-webui
#
# Exclusões de análise para diretórios que não são código de produto:
# documentação, catálogos de skills/agents (vendor/compat) e config de CI.
# O dotnet-sonarscanner do CI (code-quality.yml) já passa o mesmo conjunto
# via /d:sonar.exclusions — este arquivo garante a exclusão também para o
# SonarScanner CLI e análises fora do pipeline.
#
# Observação: issues já abertas no board NÃO são fechadas pela exclusão —
# o cleanup dos ~2260 itens stale de docs//skills/ é ação manual documentada
# em .claude/memory/sonar-vendor-cleanup.md (requer SONAR_TOKEN).
sonar.exclusions=docs/**,skills/**,.agents/**,.claude/skills/**,.devin/**,.ci/**

# Duplicação (CPD): migrations geradas pelo EF Core não são código escrito.
sonar.cpd.exclusions=**/Migrations/**
